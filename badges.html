<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Badges</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <h1 class="text-center text-success">Bootstrap Badges</h1>
    <div class="container">
        <h3><img src="icon.png" alt="icon" width="30" height="30">
        <span class="badge bg-danger fs-6 position-relative top-0 start-0 translate-middle-y">5</span></h3>
        <h3> Messages
          <span class="badge bg-danger fs-6 position-relative top-0 start-0 translate-middle-y">10</span></h3>
    </div>
</body>
</html>
