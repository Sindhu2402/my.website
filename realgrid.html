<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
     <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-3 bg-dark text-white p-4">
                <h2 class="mb-4 text-white">Student Details</h2>
                <ul class="mb-4">
               <li class="mb-3"><a href="" class="text-decoration-none text-white">Dashboard</a></li>
              <li class="mb-3"><a href="" class="text-decoration-none text-white">Students</a></li>
             <li class="mb-3"><a href="" class="text-decoration-none text-white">Departments</a></li>                           
              <li class="mb-3"><a href="" class="text-decoration-none text-white">Courses</a></li>                                          
               <li class="mb-3"><a href="" class="text-decoration-none text-white">Placements</a></li>
             </ul>
            </div>
            <div class="col-9">
                <h1 class="text-center">Student Dshaboard</h1>
                <div class="row">
                    <div class="col-3">
                     <div class="bg-primary text-white p-4 rounded">
                       <h5>Students</h5>
                       <h2>250</h2>
                       <p class="mb-0">Total Students</p>
                     </div> 
                    </div> 
                      <div class="col-3">
                     <div class="bg-success text-white p-4 rounded">
                       <h5>Departments</h5>
                       <h2>10</h2>
                       <p class="mb-0">Total Departments</p>
                     </div> 
                    </div>
                     <div class="col-3">
                     <div class="bg-warning text-white p-4 rounded">
                       <h5>Course</h5>
                       <h2>10</h2>
                       <p class="mb-0">Active Course</p>
                     </div>
                </div>
            
                 <div class="col-3">
                     <div class="bg-info text-white p-4 rounded">
                       <h5>Placements</h5>
                       <h2>50</h2>
                       <p class="mb-0">Students Placed</p>
                     </div>
                </div>
            </div>
            </div>
                </div>
            </div>
</body>
</html>
