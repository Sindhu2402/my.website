
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grid</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .container {
            border: 2px solid black;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .product-card {
            padding: 6px;
            text-align: center;
            height: 190px;
        }

        .product-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-name {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 class="text-center">Our Products</h2>
    <div class="row justify-content-center g-4">
        <div class="col-md-4">
            <div class="container">
                <h3 class="text-info text-center mb-4">Pet Foods</h3>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="product-card">
                            <img src="cat food.jpg" class="product-img">
                            <div class="product-name">Cat Food </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="bird food.jpg" class="product-img">
                            <div class="product-name">Bird Food</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="dog food.jpg" class="product-img">
                            <div class="product-name">Dog Food</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="fish food.jpg" class="product-img">
                            <div class="product-name">Fish Food</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="container">
                <h3 class="text-warning text-center mb-4">Dry Fruits</h3>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="product-card">
                            <img src="almonds.jpg" class="product-img">
                            <div class="product-name">Almond</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="cashews.jpg" class="product-img">
                            <div class="product-name">Cashews</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="chia seeds.jpg" class="product-img">
                            <div class="product-name">Chia Seeds</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="dates.jpg" class="product-img">
                            <div class="product-name">Dates</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
         <div class="col-md-4">
            <div class="container">
                <h3 class="text-primary text-center mb-4">Toys</h3>
                <div class="row g-3">
                    <div class="col-6">
                        <div class="product-card">
                            <img src="rc cars.jpg" class="product-img">
                            <div class="product-name">Car</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="airplanes.jpg" class="product-img">
                            <div class="product-name">AirPlanes</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="buses.jpg" class="product-img">
                            <div class="product-name">Buses</div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="product-card">
                            <img src="motor vehicle.jpg" class="product-img">
                            <div class="product-name">Motor Vehicle</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
