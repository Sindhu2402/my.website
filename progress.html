
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Progress</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <h1 class="text-center text-success">
        Bootstrap Progress Bar
    </h1>

    <div class="container">

        <div class="progress mt-4">
            <div class="progress-bar bg-success" style="width: 25%;">
                25%
            </div>
        </div>

        <div class="progress mt-4">
            <div class="progress-bar bg-info" style="width: 50%;">
                50%
            </div>
        </div>

        <div class="progress mt-4">
            <div class="progress-bar bg-danger" style="width: 75%;">
                75%
            </div>
        </div>

        <div class="progress mt-4">
            <div class="progress-bar bg-dark" style="width: 100%;">
                100%
            </div>
        </div>

    </div>

</body>

</html>
