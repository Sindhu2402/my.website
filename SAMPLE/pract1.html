<!DOCTYPE html>
<html>
<head>
    <title>Zoho</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<style>

.navbar{ background:whitesmoke; }


.carousel-item{ height:380px; }
.banner1{ background:#EAF6FF ; }
.banner2{ background:#FFFAF0; }
.center-box{ height:100%; 
    display:flex; 
    align-items:center; 
    justify-content:center; }
.carousel-item img{
     max-height:320px;
      object-fit:contain; }

</style>
</head>
<body>

<nav class="navbar navbar-expand-lg shadow-sm p-3">
  <div class="container">
    <img src="zoho.png" width="90" height="50">
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNavbar"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="">About</a></li>
        <li class="nav-item"><a class="nav-link" href="">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="">Contact</a></li>
      </ul>
    </div>
  </div>
  <h3 class="me-3"><img src="icon.png" width="30" height="30"><span class="badge bg-danger fs-6 position-relative top-0 start-0 translate-middle-y">5</span></h3>
</nav>

<div id="toyCarousel" class="carousel slide w-100" data-bs-ride="carousel" data-bs-interval="3000">
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#toyCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#toyCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#toyCarousel" data-bs-slide-to="2"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active banner1"><div class="center-box"><img src="banner1.png"></div></div>
    <div class="carousel-item banner2"><div class="center-box"><img src="banner2.png"></div></div>
    <div class="carousel-item banner3"><div class="center-box"><img src="banner3.png"></div></div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#toyCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
  <button class="carousel-control-next" type="button" data-bs-target="#toyCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
</div>

<div class="hero-section">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6 col-12 mb-4 mb-lg-0 text-center text-lg-start">
        <img src="toys-hero.png" class="hero-img" alt="toys">
      </div>
      <div class="col-lg-6 col-12">
        <h1 class="hero-title">Your playtime,<br> supercharged</h1>
        <p class="hero-text">
          Zoho Toys delivers soft teddies, safe toys and cuddly gifts with premium quality and advanced safety – all in one plan. Flat 20% OFF on first order.
        </p>
        <button class="hero-btn">Shop Toys Now</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
