<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
.carousel-item img {
  
        width: 50% !important;
        height: 300px;
        object-fit:contain;
        margin: auto;
    margin-top: 20px;
}
</style>
<body>
    <div id="mycarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#mycarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#mycarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#mycarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="sploffer.jpg" class="d-block w-50">
                <div class="carousel-caption">

                </div>
            </div>
            <div class="carousel-item">
                <img src="drs1.jpg" class="d-block w-100">
                <div class="carousel-caption">

                </div>
            </div>
            <div class="carousel-item">
                <img src="drs2.jpg" class="d-block w-100">
                <div class="carousel-caption">
                </div>
            </div>
           
        </div>
        <button class="carousel-control-prev" data-bs-target="#mycarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          
        </button>
        <button class="carousel-control-next" data-bs-target="#mycarousel" data-bs-slide="next" type="button">
            <span class="carousel-control-next-icon"></span>
         
        </button>
    </div>
</body>
</html>
